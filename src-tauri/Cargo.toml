[package]
name = "uxuescript"
version = "0.1.0"
description = """
    A xuexitong course-dealing application written in Tauri, Old vision is written in Pyside6,
    but now I rewrite it in Rust to make it more efficient and cross-platform.
"""
authors = ["unraous"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uxs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [
    "unstable",
    "macos-private-api",
    "webview-data-url",
    "image-ico",
    "image-png",
    "devtools",
] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
serde_json = "1.0.151"
log = { version = "0.4.33", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
chrono = "0.4.45"
fern = { version = "0.7.1", features = ["colored"] }
toml = "1.1.3"
scraper = "0.27.0"
regex = "1.13.1"
base64 = "0.22.1"
ttf-parser = "0.25.1"
async-trait = "0.1.91"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
dotenv = "0.15.0"
strum = { version = "0.28.0", features = ["derive"] }
commands_collector = { path = "./crates/commands_collector" }
parking_lot = { version = "0.12.5", features = ["serde"] }
thiserror = "2.0.19"
md5 = "0.7"




[dev-dependencies]
flate2 = "1.1"

[workspace]
members = ["crates/commands_collector"]
default-members = [".", "crates/commands_collector"]

# 降低 debug 调试信息级别（显著减少磁盘 I/O 和链接体积）
[profile.dev]
debug = 1
codegen-units = 256

# 第三方依赖开启 3 级优化（依赖库只需编译一次，优化后编译产物更小，加速后续链接）
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
